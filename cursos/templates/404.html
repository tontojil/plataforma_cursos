<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error 404 - Plataforma de Cursos Online</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 12px;
            color: aliceblue;
        }

        /* Cuerpo */
        .cuerpo {
            padding: 60px 20px;
        }

        .cuadro {
            background-color: #303030;
            border: 1px solid aqua;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .titulo_error {
            color: aqua;
            font-size: 4em;
        }

        /* Pie de pagina */
        .div_del_fondo {
            background: rgb(28, 28, 28);
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="cuerpo">
        <div class="cuadro">
            <h1 class="titulo_error">404</h1>
            <p>La pagina que buscas no existe en la Plataforma de Cursos Online.</p>
            <br>
            <a href="/">Volver al inicio</a>
        </div>
    </main>

    <!-- Pie de pagina -->
    <footer class="div_del_fondo">
        <p>Plataforma de Cursos Online - by tonto jil</p>
    </footer>
</body>
</html>
