<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plataforma de Cursos Online</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 12px;
            color: aliceblue;
        }

        /* Titulo */
        .div_del_titulo {
            background-color: rgb(18, 18, 18);
            padding: 30px;
            text-align: center;
        }

        .titulo {
            color: white;
            text-transform: uppercase;
        }

        /* Cuerpo */
        .cuerpo {
            padding: 30px 20px;
        }

        .cuadro {
            background-color: #303030;
            border: 1px solid aqua;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Pie de pagina */
        .div_del_fondo {
            background: rgb(28, 28, 28);
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Titulo -->
    <header class="div_del_titulo">
        <h1 class="titulo">{{ nombre_proyecto }}</h1>
    </header>

    <main class="cuerpo">
        <div class="cuadro">
            <h2>Bienvenido</h2>
            <p>{{ descripcion }}</p>
            <br>
            <p>Proyecto de Evaluacion 1 - Backend con Python y Django</p>
        </div>
    </main>

    <!-- Pie de pagina -->
    <footer class="div_del_fondo">
        <p>Plataforma de Cursos Online - by pablo aros</p>
    </footer>
</body>
</html>
